blueprint:
  name: Toggle switches on button press (bidirectional)
  description: >
    Triggered by a button press event. Toggles one switch and mirrors its new state
    to the other. Optionally add a second trigger to mirror in the opposite direction.
  domain: automation
  input:
    entity_1:
      name: Trigger Entity 1
      description: The entity_id (e.g. button or remote) that toggles Switch 1 → Switch 2
      selector:
        entity: {}
    event_type_1:
      name: Event type for Entity 1
      description: The type of event to listen for (e.g. zha_event, deconz_event, etc.)
      default: zha_event
      selector:
        text:
    entity_2:
      name: Trigger Entity 2 (optional)
      description: The entity_id (e.g. button or remote) that toggles Switch 2 → Switch 1
      default: ""
      selector:
        entity: {}
    event_type_2:
      name: Event type for Entity 2 (optional)
      description: The type of event to listen for
      default: ""
      selector:
        text:
    switch_1:
      name: Switch 1
      selector:
        entity:
          domain: switch
    switch_2:
      name: Switch 2
      selector:
        entity:
          domain: switch

trigger:
  - platform: event
    event_type: !input event_type_1
    event_data:
      entity_id: !input entity_1
  - platform: event
    event_type: !input event_type_2
    event_data:
      entity_id: !input entity_2

action:
  - variables:
      switch1: !input switch_1
      switch2: !input switch_2
      trigger_entity: "{{ trigger.event.data.entity_id }}"
      entity1: !input entity_1
      entity2: !input entity_2

  - choose:
      # Case 1: Triggered by Entity 1 → Toggle Switch 1, mirror to Switch 2
      - conditions: "{{ trigger_entity == entity1 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input switch_1
                    state: "on"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input switch_1
                  - service: switch.turn_off
                    target:
                      entity_id: !input switch_2
              - conditions:
                  - condition: state
                    entity_id: !input switch_1
                    state: "off"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input switch_1
                  - service: switch.turn_on
                    target:
                      entity_id: !input switch_2

      # Case 2: Triggered by Entity 2 → Toggle Switch 2, mirror to Switch 1
      - conditions: "{{ trigger_entity == entity2 and entity2 != '' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input switch_2
                    state: "on"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input switch_2
                  - service: switch.turn_off
                    target:
                      entity_id: !input switch_1
              - conditions:
                  - condition: state
                    entity_id: !input switch_2
                    state: "off"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input switch_2
                  - service: switch.turn_on
                    target:
                      entity_id: !input switch_1

