blueprint:
  name: Toggle two switches from Event entities (bidirectional, attribute only)
  description: >
    Uses state triggers on Event entities (domain: event). When the `event_type`
    attribute of Event 1 matches the chosen press type, Switch 1 toggles and
    mirrors to Switch 2. Event 2 does the reverse (toggle Switch 2 then mirror
    to Switch 1).
  domain: automation

  input:
    event_entity_1:
      name: Event entity 1
      description: Event entity that represents the first button (domain: event)
      selector:
        entity:
          domain: event

    press_type_1:
      name: Event type for Event 1
      description: The event_type attribute value to react to (e.g., single_press, double_press)
      default: single_press
      selector:
        text:

    event_entity_2:
      name: Event entity 2 (reverse direction)
      description: Event entity that represents the second button (domain: event)
      selector:
        entity:
          domain: event

    press_type_2:
      name: Event type for Event 2
      description: The event_type attribute value to react to for Event 2
      default: single_press
      selector:
        text:

    switch_1:
      name: Switch 1
      selector:
        entity:
          domain: switch

    switch_2:
      name: Switch 2
      selector:
        entity:
          domain: switch

trigger:
  - platform: state
    entity_id: !input event_entity_1
  - platform: state
    entity_id: !input event_entity_2

mode: single

action:
  - variables:
      e1: !input event_entity_1
      e2: !input event_entity_2
      t1: !input press_type_1
      t2: !input press_type_2
      ev_attr_type: "{{ trigger.to_state.attributes.event_type if trigger.to_state is defined else '' }}"
      fired_entity: "{{ trigger.entity_id }}"

  - choose:

      # Case 1: Event entity 1 fired with matching attribute
      - conditions:
          - condition: template
            value_template: "{{ fired_entity == e1 and ev_attr_type == t1 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input switch_1
                    state: "on"
                sequence:
                  - service: switch.turn_off
                    target: { entity_id: !input switch_1 }
                  - service: switch.turn_off
                    target: { entity_id: !input switch_2 }
              - conditions:
                  - condition: state
                    entity_id: !input switch_1
                    state: "off"
                sequence:
                  - service: switch.turn_on
