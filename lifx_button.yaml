# blueprints/automation/local/lifx_button.yaml
#
# ONE INSTANCE PER PHYSICAL BUTTON. That is the whole scheme.
#
# Gestures are per button, so the instance is per button. Mirroring hangs
# off the AUTHORITY's state, not off any button, so it fires correctly no
# matter which instance happens to contain it. That means duplication is
# safe here: fill `followers` on every button that controls the same
# authority. Extra copies cost one guarded no-op run each and buy you the
# absence of a hidden dependency — no instance is secretly load-bearing for
# another, and deleting a button cannot silently stop the mirroring.
#
# authority   the entity holding the true state: the light or light group
#             when nothing is hard-wired, or the attached relay when a dumb
#             load is wired to a switch (hardware wins, the group follows).
#
#             Optional. Leave it empty for a button that only carries
#             gestures — the single press, mirroring, sync and heal paths
#             all no-op and double and long press still work.
#
# wired       true only for the one button physically switching the
#             authority. It then predicts instead of commanding, because
#             commanding would fight the hardware. Every other button on
#             the same authority leaves this false.
#
# indicators  detached relays whose only job is to show the authority's
#             state. ALWAYS forced to match, including at start and hourly
#             heal, because an indicator that disagrees is simply wrong.
#             After a press they are written even when they already look
#             correct: a detached relay toggles its own reported state when
#             pressed, so that read is stale and the difference check would
#             skip precisely the write that fixes it.
#
# followers   real lights brought into line WHEN THE AUTHORITY CHANGES, and
#             then left alone. They are not re-asserted at heal, so an 11pm
#             all-off, a scene, or a dimmer press can move them without this
#             automation dragging them back within the hour.
#
#             If you want a light strictly slaved to the authority with no
#             independent control, list it as an indicator instead. That
#             choice is per room and this is where you make it.
#
# Never list the authority itself in either.

blueprint:
  name: LIFX button
  description: >
    One LIFX switch button, with its own double and long press actions, and
    optional one-way mirroring of its authority onto a set of followers.
  domain: automation
  input:
    button:
      name: Button event entity
      selector:
        entity:
          filter:
            domain: event

    authority:
      name: Authoritative entity
      description: >
        Optional. The entity holding the true state. Leave empty for a
        button that exists only to carry double or long press gestures —
        the mirroring, sync and heal paths then do nothing at all. Pick at
        most one; if more than one is given, only the first is used.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: [light, switch]

    wired:
      name: This button is hard-wired to the authority
      default: false
      selector:
        boolean:

    indicators:
      name: Indicators
      description: >
        Optional. Detached relays showing the authority's state. Always
        enforced, including at start and hourly heal. Safe to repeat across
        every button instance for this authority.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: [light, switch]

    followers:
      name: Followers
      description: >
        Optional. Real lights moved when the authority changes, then left
        alone. Not re-asserted at heal, so they stay independently
        controllable.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: [light, switch]

    double_target:
      name: Double press target
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: [light, switch]

    long_press_actions:
      name: Long press actions
      default: []
      selector:
        action:

# Parallel, not queued: the press branches end with a short wait for the
# authority to report, and queueing would make a second press sit behind
# that wait. Every write is guarded and idempotent, so concurrent runs
# converge rather than fight.
mode: parallel
max: 25
max_exceeded: silent

variables:
  authority_in: !input authority
  # The authority selector is `multiple` purely so it can be left empty.
  # Accept both shapes: an instance created before that change stores a
  # plain string, and `| first` on a string yields its first character.
  authority: >
    {{ authority_in if authority_in is string
       else (authority_in | first if authority_in | count > 0 else '') }}
  # Guard every use of `authority`. With no authority the single press,
  # sync, start, heal and tail paths all no-op, leaving a gesture-only
  # button: double and long press still work.
  has_authority: "{{ authority | length > 0 }}"
  wired: !input wired
  indicators: !input indicators
  followers: !input followers
  double_target: !input double_target

triggers:
  - trigger: event.received
    target:
      entity_id: !input button
    options:
      event_type: [single_press]
    id: single

  - trigger: event.received
    target:
      entity_id: !input button
    options:
      event_type: [double_press]
    id: double

  - trigger: event.received
    target:
      entity_id: !input button
    options:
      event_type: [long_press]
    id: long

  # No `from:` restriction, so this also catches the authority returning
  # from unavailable.
  - trigger: state
    entity_id: !input authority
    to: ["on", "off"]
    id: sync

  - trigger: homeassistant
    event: start
    id: start

  - trigger: time_pattern
    hours: "/1"
    id: heal

actions:
  - choose:

      # Not hard-wired: command the authority. The sync branch below then
      # moves the followers.
      - conditions:
          - condition: trigger
            id: single
          - condition: template
            value_template: "{{ has_authority and not wired }}"
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: "{{ authority }}"

      # Hard-wired: hardware already switched it, so only predict. A wrong
      # guess is corrected by the sync branch when the relay reports.
      - conditions:
          - condition: trigger
            id: single
          - condition: template
            value_template: >
              {{ has_authority and wired
                 and (followers + indicators) | count > 0
                 and states(authority) in ['on', 'off'] }}
        sequence:
          - variables:
              want: "{{ 'off' if is_state(authority, 'on') else 'on' }}"
          - action: "homeassistant.turn_{{ want }}"
            target:
              entity_id: "{{ followers + indicators }}"

      - conditions:
          - condition: trigger
            id: double
          - condition: template
            value_template: "{{ double_target | count > 0 }}"
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: "{{ double_target }}"

      - conditions:
          - condition: trigger
            id: long
        sequence: !input long_press_actions

      # ---------------- authority -> followers / indicators ----------------
      # On an authority change, move everything. On start or heal, touch
      # indicators ONLY — re-asserting real lights here would undo any
      # legitimate independent change, such as a scheduled all-off.
      - conditions:
          - condition: trigger
            id: [sync, start, heal]
        sequence:
          # Let the integrations connect before trusting any state.
          - delay: "{{ 60 if trigger.id == 'start' else 0 }}"
          - variables:
              targets: >
                {{ indicators if trigger.id in ['start', 'heal']
                   else followers + indicators }}
          - condition: template
            value_template: >
              {{ has_authority and targets | count > 0
                 and states(authority) in ['on', 'off'] }}
          - variables:
              want: "{{ states(authority) }}"
              # On `sync` the press has just happened and a detached relay
              # may still be reporting its own local toggle, so our read of
              # an INDICATOR is stale and the difference check would skip
              # the one write that matters. Turning a switch on when it is
              # already on is a no-op at the device and produces no state
              # change, so there is nothing to loop on.
              #
              # Only indicators need this. Nothing this button does moves a
              # follower in hardware, so a follower's read is never stale in
              # the same way, and re-asserting turn_on onto a light that is
              # already on risks disturbing its level.
              force: "{{ trigger.id == 'sync' }}"
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                # Availability is checked separately from the difference:
                # `force` must not reach a dead entity, because a raising
                # service call aborts the run and every target after this
                # one in the list would go unwritten.
                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item) not in ['unavailable', 'unknown']
                           and (states(repeat.item) != want
                                or (force and repeat.item in indicators)) }}
                  then:
                    - action: "homeassistant.turn_{{ want }}"
                      target:
                        entity_id: "{{ repeat.item }}"

  # ---------------- tail reconcile after a press ----------------
  # A prediction is optimistic. If the authority did NOT end up changing —
  # a press that toggled it back, a double press consuming two toggles, a
  # command that never landed — then no state trigger fires and nothing
  # corrects the guess. It would sit wrong until the hourly heal. So after
  # any press, wait briefly for the authority to report, then re-assert
  # from its actual state.
  # The gate names exactly what the tail would write, so a button with
  # followers but no indicators does not sit through the wait to do nothing.
  - if:
      - condition: trigger
        id: [single, double, long]
      - condition: template
        value_template: >
          {{ has_authority
             and (indicators | count > 0
                  or (wired and trigger.id == 'single'
                      and followers | count > 0)) }}
    then:
      # On a NON-wired press the authority usually reports while the toggle
      # above is still being awaited, before this listener exists, so the
      # full timeout elapses. That is fine — the read below is then simply
      # the settled value. The wait earns its keep on a wired press, where
      # the relay's report genuinely arrives after this point.
      - wait_for_trigger:
          - trigger: state
            entity_id: !input authority
            to: ["on", "off"]
        timeout: "00:00:03"
        continue_on_timeout: true
      - variables:
          tail: >
            {{ indicators + (followers
               if (wired and trigger.id == 'single') else []) }}
          settled: "{{ states(authority) }}"
      - condition: template
        value_template: "{{ settled in ['on', 'off'] }}"
      - repeat:
          for_each: "{{ tail }}"
          sequence:
            # Same split as the sync branch: indicators are written even
            # when they look correct, because after a press that read is
            # stale. This is the step that recovers a pair which started
            # out of sync. Followers stay difference-guarded.
            - if:
                - condition: template
                  value_template: >
                    {{ states(repeat.item) not in ['unavailable', 'unknown']
                       and (states(repeat.item) != settled
                            or repeat.item in indicators) }}
              then:
                - action: "homeassistant.turn_{{ settled }}"
                  target:
                    entity_id: "{{ repeat.item }}"
